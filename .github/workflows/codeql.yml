# Анализ безопасности кода GitHub CodeQL: результаты — вкладка Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # каждый понедельник

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL · Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
          config: |
            paths-ignore:
              - app/web/static/vendor
              - tests
              - e2e
      - uses: github/codeql-action/analyze@v3
